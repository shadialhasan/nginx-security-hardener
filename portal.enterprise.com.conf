# ==============================================================================
# Hardened Nginx Virtual Host for: portal.enterprise.com
# Generated by Nginx Security Hardener (Author: Eng. MHD. Shadi AL-Hasan)
# Security Preset: strict | Rate Limit Preset: standard
# ==============================================================================

# Rate Limit Zone Allocation
limit_req_zone $binary_remote_addr zone=limit_portal_enterprise_com:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name portal.enterprise.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.enterprise.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/portal.enterprise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.enterprise.com/privkey.pem;

    # Mozilla Modern SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Hide Nginx Version
    server_tokens off;

    # Rate Limiting & Buffer Overflow Protection
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 50m;
    large_client_header_buffers 4 8k;

    location / {
    # Rate Limiting (Standard Preset: 30r/s, burst=50)
    limit_req zone=limit_portal_enterprise_com burst=50 nodelay;
    limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket Reverse Proxy Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
